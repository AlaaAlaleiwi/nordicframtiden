services:
  api:
    build: .
    container_name: nordicframtiden-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL must be set}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME must be set}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

      # Flyway
      SPRING_FLYWAY_ENABLED: "true"

    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nordicframtiden}
      POSTGRES_USER: ${POSTGRES_USER:-nordic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  coturn:
    image: coturn/coturn:4.6.3-r3
    command:
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-calls.nordicframtiden.local}
      - --user=${TURN_USERNAME:-nordic}:${TURN_PASSWORD:?TURN_PASSWORD must be set}
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP must be set}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped

volumes:
  pgdata:
