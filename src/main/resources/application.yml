app:
  jwt:
    secret: CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS
    accessTokenMinutes: ${APP_JWT_EXPIRES_MIN:60}
    issuer: ${APP_JWT_ISSUER:nordicframtiden}

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

logging:
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://pg-nordidcframtiden-nordicframtiden.h.aivencloud.com:21542/defaultdb?sslmode=require
    username: avnadmin
    password: AVNS__6SVGDfEFlW9YSxzCFE
  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
  redis:
    time-to-live: 86400000  # 24h in ms — tune to your needs
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
  